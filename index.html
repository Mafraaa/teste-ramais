
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diretório de Ramais</title>
https://cdn.tailwindcss.com
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
body { font-family: 'Inter', sans-serif; }
</style>
</head>

<body class="bg-slate-900 min-h-screen text-slate-100 antialiased">
<div class="max-w-7xl mx-auto p-6 md:p-10">


<!-- HEADER -->
<div class="mb-8">
<h1 class="text-2xl md:text-3xl font-bold text-white flex items-center gap-2">
<i data-lucide="phone"></i>
Diretório de Ramais
</h1>
<p class="text-slate-400 text-sm mt-1">
Busca rápida e inteligente de ramais internos
</p>
</div>
<!-- BUSCA -->
<div class="flex flex-col md:flex-row gap-3 mb-6">
<input
id="searchInput"
placeholder="Buscar por número, setor, atribuição ou localização..."
class="flex-1 p-3 bg-slate-800 border border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
>


<select
id="statusFilter"
class="p-3 bg-slate-800 border border-slate-700 rounded-xl text-sm"
>
<option value="all">Todos os Status</option>
<option value="Ativo">Ativo</option>
<option value="Inativo">Inativo</option>
</select>
</div>

<!-- TABELA -->
<div class="bg-slate-950 border border-slate-800 rounded-2xl overflow-hidden">


<table class="w-full text-left">


<thead class="bg-slate-900 text-slate-400 text-xs uppercase">
<tr>
<th class="py-3 px-4">Ramal</th>
<th class="py-3 px-4">Setor</th>
<th class="py-3 px-4">Atribuição</th>
<th class="py-3 px-4">Local</th>
<th class="py-3 px-4 text-center">Status</th>
</tr>
</thead>


<tbody id="tableBody" class="text-sm divide-y divide-slate-900"></tbody>


</table>


<div id="emptyState" class="hidden text-center py-12">
<p class="text-slate-400">Nenhum resultado encontrado</p>
</div>

</div>

</div>


<script>
const ramaisMock = [
{ numero: '79012', setor: 'Controle de Leitos', atribuicao: 'Central de Altas e Vagas', local: 'Bloco D - 3º', status: 'Ativo' },
{ numero: '79015', setor: 'Controle de Leitos', atribuicao: 'Coordenação Operacional', local: 'Bloco D - 3º', status: 'Ativo' },
{ numero: '72646', setor: 'SCIH', atribuicao: 'Infecção Hospitalar', local: 'Bloco A - 1º', status: 'Ativo' },
{ numero: '71234', setor: 'Pronto Atendimento', atribuicao: 'Triagem', local: 'Térreo', status: 'Ativo' },
{ numero: '75500', setor: 'Engenharia Clínica', atribuicao: 'Suporte Equipamentos', local: 'Subsolo -2', status: 'Ativo' },
{ numero: '78001', setor: 'TI', atribuicao: 'Service Desk', local: 'Bloco A - 5º', status: 'Ativo' },
{ numero: '74412', setor: 'Farmácia', atribuicao: 'Dispensação', local: 'Bloco C', status: 'Ativo' },
{ numero: '73309', setor: 'RH', atribuicao: 'Atendimento', local: 'Bloco B', status: 'Ativo' },
{ numero: '70117', setor: 'Alimentação', atribuicao: 'Viena Café', local: 'Conveniência', status: 'Inativo' }
];

const tableBody = document.getElementById('tableBody');
const searchInput = document.getElementById('searchInput');
const statusFilter = document.getElementById('statusFilter');
const emptyState = document.getElementById('emptyState');
function renderTable(data) {
 tableBody.innerHTML = '';


 if (data.length === 0) {
 emptyState.classList.remove('hidden');
 return;
 } else {
 emptyState.classList.add('hidden');
 }


 data.forEach(item => {
 const isAtivo = item.status === 'Ativo';
 const statusClass = isAtivo
 ? 'text-emerald-400 bg-emerald-400/10'
 : 'text-slate-400 bg-slate-700/30';


 tableBody.innerHTML += `
 <tr class="hover:bg-slate-900/50">
 <td class="py-3 px-4 text-blue-400 font-bold">${item.numero}</td>
 <td class="py-3 px-4 text-white">${item.setor}</td>
 <td class="py-3 px-4 text-slate-400">${item.atribuicao}</td>
 <td class="py-3 px-4 text-slate-400">${item.local}</td>
 <td class="py-3 px-4 text-center">
 <span class="px-2 py-1 text-xs font-semibold rounded ${statusClass}">
 ${item.status}
 </span>
 </td>
 </tr>`;
 });
}

function filterData() {
 const query = searchInput.value.toLowerCase();
 const status = statusFilter.value;

 const filtered = ramaisMock.filter(item => {
 return (
 (item.numero.includes(query) ||
 item.setor.toLowerCase().includes(query) ||
 item.atribuicao.toLowerCase().includes(query) ||
 item.local.toLowerCase().includes(query)) &&
 (status === 'all' || item.status === status)
 );
 });

 renderTable(filtered);
}

searchInput.addEventListener('input', filterData);
statusFilter.addEventListener('change', filterData);

renderTable(ramaisMock);
lucide.createIcons();
</script>

</body>
