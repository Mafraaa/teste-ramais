
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diretório de Ramais</title>
https://cdn.tailwindcss.com
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
body { font-family: 'Inter', sans-serif; }
</style>
</head>
<body class="bg-slate-900 text-white min-h-screen">

<div class="max-w-6xl mx-auto p-6">

<h1 class="text-2xl font-bold mb-6 flex items-center gap-2">
<i data-lucide="phone"></i> Diretório de Ramais
</h1>

<div class="flex gap-3 mb-4">
<input id="searchInput" placeholder="Buscar..." class="flex-1 p-2 bg-slate-800 rounded">
<select id="statusFilter" class="p-2 bg-slate-800 rounded">
<option value="all">Todos</option>
<option value="Ativo">Ativo</option>
<option value="Inativo">Inativo</option>
</select>
</div>

<div class="overflow-x-auto">
<table class="w-full text-left">
<thead class="text-slate-400 text-xs uppercase">
<tr>
<th class="p-2">Ramal</th>
<th class="p-2">Setor</th>
<th class="p-2">Atribuição</th>
<th class="p-2">Local</th>
<th class="p-2">Status</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>

</div>

<script>
const ramaisMock = [
{ numero: '79012', setor: 'Controle de Leitos', atribuicao: 'Central de Altas e Vagas', local: 'Morumbi', status: 'Ativo' },
{ numero: '72646', setor: 'SCIH', atribuicao: 'Infecção Hospitalar', local: 'Morumbi', status: 'Ativo' },
{ numero: '78001', setor: 'TI', atribuicao: 'Service Desk', local: 'Morumbi', status: 'Ativo' },
{ numero: '70117', setor: 'Alimentação', atribuicao: 'Viena Café', local: 'Morumbi', status: 'Inativo' }
];

const tableBody = document.getElementById('tableBody');
const searchInput = document.getElementById('searchInput');
const statusFilter = document.getElementById('statusFilter');

function renderTable(data) {
 tableBody.innerHTML = '';
 data.forEach(item => {
 tableBody.innerHTML += `
 <tr class="border-b border-slate-800">
 <td class="p-2 text-blue-400">${item.numero}</td>
 <td class="p-2">${item.setor}</td>
 <td class="p-2 text-slate-400">${item.atribuicao}</td>
 <td class="p-2 text-slate-400">${item.local}</td>
 <td class="p-2">${item.status}</td>
 </tr>`;
 });
}

function filterData() {
 const query = searchInput.value.toLowerCase();
 const status = statusFilter.value;

 const filtered = ramaisMock.filter(item => {
 return (
 (item.numero.includes(query) ||
 item.setor.toLowerCase().includes(query) ||
 item.atribuicao.toLowerCase().includes(query)) &&
 (status === 'all' || item.status === status)
 );
 });

 renderTable(filtered);
}

searchInput.addEventListener('input', filterData);
statusFilter.addEventListener('change', filterData);

renderTable(ramaisMock);
lucide.createIcons();
</script>

</body>
</html>
